name: Compliance gates (Dev 4)

# Sprint spec: "CI/CD gate — build MUST FAIL if outbound SMS is attempted
# for a contact where inbound_sms_count=0 AND booked_appointment_id IS NULL"
# This workflow enforces that removing or bypassing any compliance gate
# causes the build to fail before merge.

on:
  # Deliberately unfiltered (Dev Item D-6, audit 2026-09-10): an earlier
  # path filter here only ran this gate on 8 named files, so a PR adding a
  # new SMS send path elsewhere (e.g. src/services/sms_dispatch.py's own
  # readiness-check wiring, the exact class of bug D-7 fixed) would never
  # trigger it. Matches tests.yml's own unfiltered "every PR" posture.
  pull_request: {}
  push:
    branches:
      - main
      - "dev4/**"

jobs:
  compliance-gates:
    runs-on: ubuntu-latest
    # No live DB needed — all Dev 4 tests use FakeSession (MagicMock)
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_APP: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_SYSTEM: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_AKRASH: postgresql://unused:unused@localhost:5432/unused
      BLACKINK_APP_DB_PASSWORD: unused
      BLACKINK_SYSTEM_DB_PASSWORD: unused
      AKRASH_INGEST_DB_PASSWORD: unused
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cold SMS gate (build fails if gate is bypassed)
        run: PYTHONPATH=. pytest tests/test_cold_sms_gate.py -v
        # If test_gate_blocks_cold_contact fails → gate was removed → build fails

      - name: TCPA quiet hours gate
        run: PYTHONPATH=. pytest tests/test_sms_quiet_hours.py -v

      - name: Outbound template {client_firm} enforcement
        run: PYTHONPATH=. pytest tests/test_outbound_templates.py -v

      - name: Suppression & DNC scrubbing
        run: PYTHONPATH=. pytest tests/test_email_suppression.py tests/test_dnc_refresh.py -v

      - name: Per-tenant mailbox isolation
        run: PYTHONPATH=. pytest tests/test_mailbox_dispatcher.py -v

      - name: Audit report generators
        run: PYTHONPATH=. pytest tests/test_audit_report.py -v

      - name: Prompt variant registry
        run: PYTHONPATH=. pytest tests/test_prompt_variants.py -v

      - name: Full compliance suite (summary)
        run: |
          PYTHONPATH=. pytest \
            tests/test_cold_sms_gate.py \
            tests/test_sms_quiet_hours.py \
            tests/test_outbound_templates.py \
            tests/test_email_suppression.py \
            tests/test_dnc_refresh.py \
            tests/test_mailbox_dispatcher.py \
            tests/test_audit_report.py \
            tests/test_prompt_variants.py \
            -v --tb=short

      - name: Alert on failure
        if: failure()
        run: |
          echo "::error::Compliance gate suite failed — a required compliance check was removed or broken."
          echo "::error::Cold SMS gate, quiet hours, {client_firm} tag, suppression, and mailbox isolation must all pass before merge."
