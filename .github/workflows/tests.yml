name: Test suite

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blackink_owner
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: blackink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://blackink_owner:test_only_password@localhost:5432/blackink_test
      DATABASE_URL_APP: postgresql://blackink_app:test_only_password@localhost:5432/blackink_test
      DATABASE_URL_SYSTEM: postgresql://blackink_system:test_only_password@localhost:5432/blackink_test
      BLACKINK_APP_DB_PASSWORD: test_only_password
      BLACKINK_SYSTEM_DB_PASSWORD: test_only_password
      AKRASH_INGEST_DB_PASSWORD: test_only_password
      REDIS_URL: redis://localhost:6379/0
      ADMIN_JWT_SECRET: ci-test-secret-not-for-production
      # Test-only keys (not real secrets) — required by
      # src/core/token_crypto.py's encrypt_token()/decrypt_token() (calendar
      # OAuth tests, tests/test_token_crypto.py) and
      # src/services/no_show_prompts.py (Subtask 3.2.3's Mark No-Show
      # token tests), both of which exercise real
      # encryption/HMAC rather than mocking it.
      TOKEN_ENCRYPTION_KEY: sWHdVufCbVgVcqllGh3tCpyvFNKIBKO9kVkfoippIwk=
      NO_SHOW_TOKEN_SECRET: test-only-no-show-token-secret-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Migration order must match CLAUDE.md and tenant_leakage_nightly.yml.
      # Every table in config/tenant_policies.py must be created before
      # apply_rls_policies.py runs or it aborts with UndefinedTable.
      - name: Apply migrations
        run: |
          PYTHONPATH=. python migrations/apply_db_roles.py
          echo "DATABASE_URL_APP=postgresql://blackink_app:test_only_password@localhost:5432/blackink_test" >> $GITHUB_ENV
          echo "DATABASE_URL_SYSTEM=postgresql://blackink_system:test_only_password@localhost:5432/blackink_test" >> $GITHUB_ENV
          PYTHONPATH=. python migrations/apply_counties.py
          PYTHONPATH=. python migrations/apply_area_code_timezones.py
          PYTHONPATH=. python migrations/apply_clients.py
          PYTHONPATH=. python migrations/apply_relay_halts.py
          PYTHONPATH=. python migrations/apply_companies.py
          PYTHONPATH=. python migrations/apply_contacts.py
          PYTHONPATH=. python migrations/apply_pm_profiles.py
          PYTHONPATH=. python migrations/apply_owner_entities.py
          PYTHONPATH=. python migrations/apply_raw_prospect_pipeline.py
          PYTHONPATH=. python migrations/apply_events.py
          PYTHONPATH=. python migrations/apply_sandbox_dashboard_view.py
          PYTHONPATH=. python migrations/apply_compliance_gate_audit.py
          PYTHONPATH=. python migrations/apply_campaign_readiness_gate.py
          PYTHONPATH=. python migrations/apply_sms_dispatch_log.py
          PYTHONPATH=. python migrations/apply_sending_domains.py
          PYTHONPATH=. python migrations/apply_mailbox_last_used.py
          PYTHONPATH=. python migrations/apply_mailbox_smtp_credentials.py
          PYTHONPATH=. python migrations/apply_agent_work_orders.py
          PYTHONPATH=. python migrations/apply_meeting_outcomes.py
          PYTHONPATH=. python migrations/apply_contacts_prospect_objections.py
          PYTHONPATH=. python migrations/apply_sequence_runs.py
          PYTHONPATH=. python migrations/apply_sequence_touch_dispatches.py
          PYTHONPATH=. python migrations/apply_companies_google_place_id.py
          PYTHONPATH=. python migrations/apply_ghost_shopper_cleanup.py
          PYTHONPATH=. python migrations/apply_owner_visibility_scores.py
          PYTHONPATH=. python migrations/apply_ovs_audit_requests.py
          PYTHONPATH=. python migrations/apply_admin_users.py
          PYTHONPATH=. python migrations/apply_owner_contacts.py
          PYTHONPATH=. python migrations/apply_calendar_connections.py
          PYTHONPATH=. python migrations/apply_bookings.py
          PYTHONPATH=. python migrations/apply_booking_reminder_jobs.py
          PYTHONPATH=. python migrations/apply_no_show_prompt_jobs.py
          PYTHONPATH=. python migrations/apply_no_show_recovery_jobs.py
          PYTHONPATH=. python migrations/apply_self_serve_audit_submissions.py
          PYTHONPATH=. python migrations/apply_meeting_outcome_prompt_jobs.py
          PYTHONPATH=. python migrations/apply_appointment_ops.py
          PYTHONPATH=. python migrations/apply_rls_policies.py
      # Full suite — this is what actually gates a PR on every change, not
      # just the tenant-leakage path-filtered nightly. Runs
      # tests/test_sms_dispatch.py (the cold-SMS application-layer linter)
      # among everything else, closing the gap where that file existed but
      # was never wired into any CI workflow.
      - name: Run full test suite
        run: PYTHONPATH=. pytest tests/ -v
